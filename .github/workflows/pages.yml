name: Deploy applets to GitHub Pages

# Publishes both applets under one site:
#
#   /                    landing page (landing/index.html)
#   /gradient-peaks/     the calculus applet          (app/)
#   /gradient-peaks/guide/  its illustrated guide     (docs/)
#   /consumer-optimum/   the microeconomics applet    (consumer-optimum/)
#   /demand-functions/   the demand-curve applet      (demand-functions/)
#
# ONE-TIME SETUP: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Until that is done every run fails at configure-pages.
# It cannot be automated: creating a Pages site needs repo-administration
# rights, and a workflow's GITHUB_TOKEN is never granted them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # landing page at the root
          cp landing/index.html _site/index.html

          # both apps use only relative paths, so they can be moved wholesale
          # into subfolders — the service worker scope follows along
          mkdir -p _site/gradient-peaks
          cp -R app/. _site/gradient-peaks/

          mkdir -p _site/gradient-peaks/guide
          cp -R docs/. _site/gradient-peaks/guide/
          if [ -f _site/gradient-peaks/guide/guide.html ]; then
            mv _site/gradient-peaks/guide/guide.html _site/gradient-peaks/guide/index.html
          fi

          mkdir -p _site/consumer-optimum
          cp consumer-optimum/index.html _site/consumer-optimum/index.html

          mkdir -p _site/demand-functions
          cp demand-functions/index.html _site/demand-functions/index.html

          # keep the PDF guides reachable if they were committed, in both
          # languages — the Spanish edition is screenshotted in Spanish, so it
          # is a different document, not a translated copy of the English one
          for pdf in Gradient-Peaks-Guide.pdf Gradient-Peaks-Guia.pdf; do
            if [ -f "dist/$pdf" ]; then
              cp "dist/$pdf" "_site/gradient-peaks/guide/$pdf"
            fi
          done

          # the one-file build, offered as a download so a student can keep a
          # copy that works with no connection at all
          if [ -f dist/Gradient-Peaks-Lab.html ]; then
            cp dist/Gradient-Peaks-Lab.html _site/gradient-peaks/Gradient-Peaks-Lab-offline.html
          fi
          if [ -f dist/Gradient-Peaks.html ]; then
            cp dist/Gradient-Peaks.html _site/gradient-peaks/Gradient-Peaks-offline.html
          fi

          # stop Jekyll from swallowing files whose names begin with _
          touch _site/.nojekyll

      - name: Check every entry point exists and is non-empty
        run: |
          set -euo pipefail
          fail=0
          for f in \
            _site/index.html \
            _site/gradient-peaks/index.html \
            _site/gradient-peaks/guide/index.html \
            _site/consumer-optimum/index.html \
            _site/demand-functions/index.html
          do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty: $f"
              fail=1
            else
              printf '%-46s %s bytes\n' "$f" "$(wc -c < "$f")"
            fi
          done
          exit $fail

      - uses: actions/configure-pages@v5
        with:
          # Left at the default. enablement: true was tried and cannot work
          # here: it fails with "Create Pages site failed. Error: Resource not
          # accessible by integration" because creating a Pages site requires
          # administration rights the workflow token does not have. Enable
          # Pages once in Settings instead (see the note at the top).
          enablement: false

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
